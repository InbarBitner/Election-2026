name: בדיקת מבנה נתוני הכנסת

# A manual probe, never scheduled.
#
# The development sandbox cannot reach knesset.gov.il — the egress proxy
# rejects the connection outright — so the OData connector was written against
# assumed field names and shipped a bug: KNS_PersonToPosition has no `Name`
# column, so every member was filtered out and the source returned zero rows
# with no error at all.
#
# This workflow exists so the field names can be read off the live service
# instead of guessed at again. It prints structure — the key names of a couple
# of rows, and row counts — and is deliberately tiny: a handful of requests,
# spaced out, run only when somebody presses the button.
on:
  workflow_dispatch:
    inputs:
      knesset_number:
        description: "מספר הכנסת לבדיקה"
        required: false
        default: "25"

jobs:
  probe:
    name: מבנה KNS_Person / KNS_PersonToPosition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: שליפת מבנה הטבלאות
        env:
          KNESSET_NUMBER: ${{ inputs.knesset_number }}
        run: |
          python - <<'PY'
          """Print the shape of the Knesset OData entities the connector uses."""
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          BASE = "https://knesset.gov.il/Odata/ParliamentInfo.svc"
          UA = "Election2026Bot/0.1 (+https://github.com/InbarBitner/Election-2026; schema probe)"
          KNESSET = os.environ.get("KNESSET_NUMBER") or "25"


          def get(entity, service="ParliamentInfo.svc", **params):
              params.setdefault("$format", "json")
              url = f"https://knesset.gov.il/Odata/{service}/{entity}?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers={"User-Agent": UA})
              # One request every couple of seconds: this is a probe, not a crawl.
              time.sleep(2)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if isinstance(payload.get("d"), dict):
                  return payload["d"].get("results", [])
              return payload.get("value", payload.get("d") or [])


          def show(title, entity, service="ParliamentInfo.svc", **params):
              print(f"\n{'=' * 70}\n{title}\n  {service}/{entity} {params}\n{'=' * 70}")
              try:
                  rows = get(entity, service=service, **params)
              except Exception as exc:  # noqa: BLE001 — a probe reports, never fails
                  print(f"  !! {type(exc).__name__}: {exc}")
                  return []
              print(f"  rows: {len(rows)}")
              if rows:
                  print(f"  keys: {sorted(rows[0])}")
                  for row in rows[:2]:
                      print("  " + json.dumps(row, ensure_ascii=False))
              return rows


          def service_document(service):
              """List the entity sets a service exposes, so nothing is guessed."""
              url = f"https://knesset.gov.il/Odata/{service}/?$format=json"
              print(f"\n{'=' * 70}\n{service} — entity sets\n{'=' * 70}")
              request = urllib.request.Request(url, headers={"User-Agent": UA})
              time.sleep(2)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except Exception as exc:  # noqa: BLE001 — a probe reports, never fails
                  print(f"  !! {type(exc).__name__}: {exc}")
                  return
              entries = payload.get("value") or payload.get("d") or []
              for entry in entries:
                  name = entry.get("name") if isinstance(entry, dict) else entry
                  print(f"    {name}")


          # 0. What each service actually exposes. KNS_PersonVotesView 404s, so
          #    the vote entity has to be found rather than assumed a second time.
          service_document("ParliamentInfo.svc")
          service_document("Votes.svc")

          # 1. Where the names actually live.
          show("שמות האנשים", "KNS_Person", **{"$top": "2"})

          # 1b. Bill titles are not on KNS_BillInitiator — find where they are.
          show("הצעות חוק", "KNS_Bill", **{"$top": "2"})

          # 2. Does filtering to the current Knesset return anything at all?
          show(
              f"תפקידים בכנסת ה-{KNESSET}",
              "KNS_PersonToPosition",
              **{"$top": "3", "$filter": f"KnessetNum eq {KNESSET}"},
          )

          # 3. …and narrowed to currently-held positions.
          show(
              f"תפקידים נוכחיים בכנסת ה-{KNESSET}",
              "KNS_PersonToPosition",
              **{"$top": "3", "$filter": f"KnessetNum eq {KNESSET} and IsCurrent eq true"},
          )

          # 4. Which PositionID means "member of Knesset".
          positions = show("רשימת התפקידים", "KNS_Position", **{"$top": "100"})
          for row in positions:
              label = row.get("Description") or row.get("Name") or ""
              print(f"    {row.get('PositionID')}: {label}")

          # 5. The per-member entities, so their field names are known too.
          show("יוזמי הצעות חוק", "KNS_BillInitiator", **{"$top": "2"})

          # 5b. KNS_Bill carries StatusID, not a status description — the text
          #     for it lives here.
          show("סטטוסים", "KNS_Status", **{"$top": "5"})

          # 5c. Votes are not in ParliamentInfo.svc at all; they are their own
          #     service. These are the four entity sets it exposes.
          for entity in (
              "View_vote_rslts_hdr_Approved",
              "View_Vote_MK_Individual",
              "vote_result_type",
          ):
              show(f"Votes: {entity}", entity, service="Votes.svc", **{"$top": "2"})

          # 6. How many people hold each candidate MK position in this Knesset —
          #    43/61 are "member of Knesset" (m/f) and 54 is faction membership,
          #    which is the row that actually carries FactionName.
          for position_id in (43, 61, 54):
              show(
                  f"PositionID {position_id} בכנסת ה-{KNESSET}",
                  "KNS_PersonToPosition",
                  **{
                      "$top": "2",
                      "$filter": f"KnessetNum eq {KNESSET} and PositionID eq {position_id}",
                      "$inlinecount": "allpages",
                  },
              )
          PY
