name: צינור נתונים יומי

# Runs the live data pipeline once a day and on demand. The steps are separate
# so that a failure in one is visible in the run log rather than hidden behind
# a single opaque "pipeline failed".
#
# Tests, typecheck and lint are NOT here — they run on every push and pull
# request from checks.yml. Keeping them apart matters: a news site changing its
# markup should never read as a failing test suite.
on:
  schedule:
    # 04:15 UTC — after the previous evening's polls are published in Israel.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "הרצה יבשה (ללא כתיבה למסד הנתונים)"
        type: boolean
        default: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Falls back to a local SQLite file when no warehouse is configured, so
      # the scheduled run still exercises every step end to end.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:../../data/election.db' }}
      # The `secrets` context is NOT available in `if:` conditionals, so the
      # question "is a warehouse configured?" is answered once here, into the
      # `env` context, which `if:` can read.
      USE_LOCAL_DB: ${{ secrets.DATABASE_URL == '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: התקנת תלויות
        run: |
          npm ci --prefix web
          pip install -r requirements.txt

      - name: הכנת מסד הנתונים
        working-directory: web
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: טעינת נתוני בסיס
        if: env.USE_LOCAL_DB == 'true'
        run: python -m pipeline.seed

      # This is the one place that touches the live sources on a schedule, and
      # it is slow on purpose: the HTTP client waits 1.5s between requests to
      # the same host, so walking every member takes several minutes. That is
      # the cost of being a well-behaved client of a public service, not a
      # problem to tune away.
      - name: הרצת ETL
        run: python -m pipeline.run_etl ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: בניית וקטורי מפלגות
        if: ${{ !inputs.dry_run }}
        run: python -m pipeline.ml.build_vectors

      # Falls back to the deterministic template when no key is configured,
      # so the brief is produced either way.
      - name: יצירת הסקירה היומית
        if: ${{ !inputs.dry_run }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.brief.generate --date today

      - name: הצגת הסקירה בסיכום הריצה
        if: ${{ !inputs.dry_run }}
        run: |
          python -m pipeline.brief.generate --date today --print >> "$GITHUB_STEP_SUMMARY"
